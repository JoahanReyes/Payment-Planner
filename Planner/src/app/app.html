</header>
<div class="flex min-h-screen bg-[var(--color-bg)] text-[var(--color-text)]">
  <!-- Sidebar -->
  <aside
    class="w-30 bg-[var(--color-bg)] text-white p-4 border-r border-[var(--color-border)] flex flex-col"

    <app-side-bar-component></app-side-bar-component>

      <router-outlet></router-outlet>

  </div>
</div>
